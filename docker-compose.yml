services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wedid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 호스트에 로컬 PostgreSQL이 이미 5432를 쓰는 경우가 있어 5433으로 매핑
      - "5433:5432"
    volumes:
      - wedid_pgdata:/var/lib/postgresql/data

volumes:
  wedid_pgdata:
