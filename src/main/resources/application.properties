spring.application.name=backend

# XLSX 원본 파일 폴더: 개발자별 환경변수로 설정
wedid.import.directory=${WEDID_IMPORT_DIRECTORY}

# PostgreSQL 연결: docker-compose 기본값과 동일 (개발자별 환경변수로 덮어쓸 수 있음)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wedid}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# 직접 만든 테이블을 사용하고 자동 생성·변경하지 않음
spring.jpa.hibernate.ddl-auto=validate

# CORS 허용 origin (쉼표로 여러 개 지정 가능)
wedid.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# 소셜 로그인 (카카오·구글 개발자 콘솔에서 발급, 개발자별 환경변수로 설정)
# 콘솔에 등록할 Redirect URI: {백엔드 주소}/api/v1/auth/callback/kakao, {백엔드 주소}/api/v1/auth/callback/google
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}
# 이메일(account_email)은 비즈 앱 전환 전에는 동의항목 권한이 없어 요청하지 않는다. 전환 후 ,account_email 추가
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/v1/auth/callback/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# 로그인 후 돌아갈 프론트엔드 주소
wedid.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
# 액세스 토큰 서명 키 (32바이트 이상, 기본값 없음)
wedid.auth.jwt-secret=${JWT_SECRET}
wedid.auth.access-token-ttl=30m
wedid.auth.refresh-token-ttl=14d
# HTTPS로 배포할 때는 true (로컬 http 개발에서는 false여야 쿠키가 저장됨)
wedid.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
