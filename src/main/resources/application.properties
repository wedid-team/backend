spring.application.name=backend

# XLSX 원본 파일 폴더: 개발자별 환경변수로 설정
wedid.import.directory=${WEDID_IMPORT_DIRECTORY}

# PostgreSQL 연결: 개발자별 환경변수 사용
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wedid}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# 직접 만든 테이블을 사용하고 자동 생성·변경하지 않음
spring.jpa.hibernate.ddl-auto=validate