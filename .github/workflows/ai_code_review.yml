name: AI Code Review

# PR이 올라오거나 새 커밋이 push될 때 BAZE AI로 줄 단위 리뷰를 남긴다.
# 리뷰는 댓글(COMMENT)로만 남기고 병합을 막지 않는다. 필수 검사로 등록하지 않는다.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

# 같은 PR에서 새 커밋이 오면 돌고 있던 이전 리뷰는 취소하고 최신 커밋만 리뷰
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 초안 PR은 건너뜀. 포크에서 온 PR은 비밀값(BAZE_API_KEY)을 받지 못하므로 건너뜀.
    # (같은 저장소 PR이 ai_review.py 자체를 고쳐서 비밀값을 유출하는 경로는, 아래
    # "신뢰된 스크립트로 교체" 스텝에서 base 브랜치 버전으로 덮어써서 막는다.)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read          # 코드 읽기
      pull-requests: write    # 리뷰 댓글 쓰기

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # base 브랜치와 비교하려면 전체 기록 필요
          # 기본값(develop과 미리 합쳐 본 커밋)이 아니라 PR 브랜치 최신 커밋을 받는다.
          # 그래야 줄 번호가 PR 파일의 실제 줄 번호와 맞아 줄 댓글이 제자리에 달린다.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 신뢰된 스크립트로 교체
        # PR이 ai_review.py/지시문을 고쳐도 그 수정본은 실행되지 않고, 항상
        # base 브랜치(main/develop)에 이미 머지된 버전만 비밀값과 함께 실행된다.
        # (diff 비교 대상인 git 기록 자체는 안 바뀌므로 리뷰 결과에는 영향 없음)
        # ai_review.py를 고치는 PR은 이 스텝 때문에 자기 자신의 새 버전으로는
        # 리뷰가 안 돌고 머지 전 버전으로 돈다 — 로컬 --dry-run으로 미리 확인할 것.
        # base에 파일이 아직 없으면(이 봇을 처음 도입하는 PR) 그대로 둔다 — git show를
        # 실패한 채로 리다이렉트하면 파일이 빈 채로 덮여써지므로 존재 여부를 먼저 확인한다.
        run: |
          for f in .github/scripts/ai_review.py .github/ai-review-instructions.md; do
            if git cat-file -e "origin/${{ github.base_ref }}:$f" 2>/dev/null; then
              git show "origin/${{ github.base_ref }}:$f" > "$f"
            else
              echo "origin/${{ github.base_ref }}에 $f 없음 — PR 버전 그대로 사용"
            fi
          done

      - name: AI review
        env:
          BAZE_API_KEY: ${{ secrets.BAZE_API_KEY }}   # Settings → Secrets에 등록
          BAZE_URL: https://api.baze.co/v1/gateway
          MODEL: gpt-6-luna
          # develop은 빠르게(low), main은 더 꼼꼼하게(medium)
          REASONING_EFFORT: ${{ github.base_ref == 'develop' && 'low' || 'medium' }}
          JSON_SCHEMA: "1"     # 답을 리뷰 JSON 형식으로 강제 (gpt-6-luna 지원 확인함)
          CHUNK_LINES: "1000"  # AI 한 번에 보낼 diff 최대 줄 수
          # 이번 실행(푸시 1번) 기준 리뷰 묶음(chunk) 상한. PR 전체 누적이 아니라 synchronize
          # 이벤트(새 커밋 push)마다 다시 최대 이만큼 호출된다 — 커밋을 여러 번 올리면
          # PR 하나의 총 호출 수는 이 값의 여러 배가 될 수 있다. 실패 시 재시도로 실행당
          # 호출 수도 최대 2배까지 늘 수 있음 (with_retry 참고). PR당 누적 상한이 필요하면
          # 이전 실행 횟수를 어딘가(예: PR 댓글, 외부 스토리지)에 저장해 추적해야 하는데,
          # 그 복잡도까지는 지금 안 들이기로 함.
          MAX_CALLS: "5"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ai_review.py

