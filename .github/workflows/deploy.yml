name: Deploy

# main에 머지(push)되면 EC2에 SSH로 접속해 최신 main을 받고, 서버에서 이미지를 빌드해 다시 띄운다.
# - 빌드는 서버(EC2 t4g, arm64)에서 한다. Actions에서는 SSH 명령과 헬스체크만 한다.
# - 비밀값(.env)은 서버의 deploy/.env에만 있다. GitHub에는 SSH 접속 정보(Secrets 3개)만 둔다.
#     EC2_HOST     서버 주소 (탄력적 IP 또는 api.wedid.site)
#     EC2_USER     SSH 사용자 (ubuntu)
#     EC2_SSH_KEY  배포 전용 SSH 개인키 전체 (deploy/README.md 5번)
# - 새 sql/ 파일은 자동 적용하지 않는다. 머지 전에 Neon에 먼저 적용해야 한다 (ddl-auto=validate라 앱이 안 뜸).

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 하나씩. 진행 중인 배포는 취소하지 않고 끝까지 기다린다
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 서버의 저장소 경로 (EC2_USER 홈 기준)
  APP_DIR: backend
  # 배포 후 응답 확인 주소 (Nginx·HTTPS·앱을 모두 거치는 공개 경로)
  HEALTHCHECK_URL: https://api.wedid.site/v3/api-docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH 접속 준비
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_HOST / EC2_SSH_KEY Secret이 비어 있습니다."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버 호스트 키 등록 (실행할 때마다 서버에서 받아옴)
          ssh-keyscan -T 15 -t ed25519 "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::서버 호스트 키를 받지 못했습니다. 보안 그룹 22번과 EC2_HOST를 확인하세요."
            exit 1
          fi

      - name: 서버에서 pull · 빌드 · 재시작
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"$APP_DIR"
          if [ ! -f deploy/.env ]; then
            echo "deploy/.env가 서버에 없습니다. deploy/README.md 1-3을 먼저 하세요." >&2
            exit 1
          fi
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main
          echo "배포 커밋: $(git log -1 --format='%h %s')"
          cd deploy
          docker compose up -d --build
          # 이전 빌드에서 남은 이름 없는 이미지 정리 (디스크 20GB)
          docker image prune -f
          docker compose ps
          REMOTE

      - name: 헬스체크
        run: |
          # 앱 기동(15~30초)과 Neon 깨우는 시간을 고려해 최대 5분 대기
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTHCHECK_URL" || true)
            if [ "$code" = "200" ]; then
              echo "응답 확인: $HEALTHCHECK_URL → 200 ($i번째 시도)"
              exit 0
            fi
            echo "대기 중 ($i/30): HTTP $code"
            sleep 10
          done
          echo "::error::헬스체크 실패: $HEALTHCHECK_URL 이 5분 안에 200을 돌려주지 않았습니다."
          exit 1

      - name: 실패 시 서버 상태 출력
        if: failure()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "cd ~/$APP_DIR/deploy && docker compose ps && docker compose logs --tail=80 app nginx" || true

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key
